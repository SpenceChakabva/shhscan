name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - name: Cross-build all platforms
        run: bash scripts/build-all.sh "${GITHUB_REF_NAME}"
      - name: Publish release with binaries + checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
